<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report an Incident | CloudSentinel</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(135deg,#eef2ff,#f4f7fb);font-family:Inter,'Segoe UI',Arial,sans-serif;color:#172033}
.box{width:100%;max-width:480px;background:#fff;padding:32px;border:1px solid #e5eaf2;border-radius:16px;box-shadow:0 15px 45px #17203312}
.brand{font-size:19px;font-weight:800;color:#14254a;margin-bottom:22px}h1{margin:0 0 8px;font-size:27px}.sub{color:#687386;line-height:1.55;margin:0 0 20px}
input,select,textarea{display:block;width:100%;padding:13px;margin:11px 0;border:1px solid #d7deea;border-radius:9px;font:inherit;background:#fff;color:#172033}textarea{min-height:130px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:#2563eb}
button,.button{display:inline-block;width:100%;padding:13px;border:0;border-radius:9px;background:#2563eb;color:white;font:inherit;font-weight:750;text-align:center;text-decoration:none;cursor:pointer;margin-top:8px}button:hover,.button:hover{background:#1d4ed8}
.error{background:#fef2f2;color:#991b1b;padding:11px 13px;border-radius:8px;font-size:14px}.foot{margin-top:20px;text-align:center;color:#687386;font-size:14px}.foot a,.back{color:#2563eb;text-decoration:none;font-weight:700}.back{display:inline-block;margin-bottom:20px}
</style><link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}"></head><body><main class="box" style="max-width:650px"><div class="brand">☁ CloudSentinel</div><a class="back" href="/student-dashboard">← Back to dashboard</a><h1>Report an incident</h1><p class="sub">Describe the issue clearly. The AI model will suggest a priority for the report.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="POST"><label for="title">Incident title</label><input id="title" name="title" maxlength="200" placeholder="e.g. Wi-Fi unavailable in lab" required><label for="description">Description</label><textarea id="description" name="description" placeholder="What happened? Include useful details." required></textarea><label for="category">Category</label><select id="category" name="category"><option>Electrical</option><option>Internet</option><option>Infrastructure</option><option>Classroom</option><option>Water</option><option>Cleanliness</option><option>Other</option></select><label for="location">Location</label><input id="location" name="location" maxlength="200" placeholder="e.g. Block B, Room 204" required><button type="submit">Submit incident report</button></form></main><script src="{{ url_for('static', filename='theme.js') }}"></script></body></html>
